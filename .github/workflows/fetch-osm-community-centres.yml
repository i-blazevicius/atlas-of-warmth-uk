# Downloads UK community centres from OSM as they stood on 1 January of each year (Overpass API)
# and keeps the result as a workflow artifact for 30 days. Runs on GitHub's servers, which can reach the API.
# Trigger: push to this branch touching the script/workflow, or "Run workflow" in the Actions tab.
name: Fetch OSM community centres

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First year"
        default: "2015"
      end:
        description: "Last year"
        default: "2025"
  push:
    branches: [community-closures-data]
    paths:
      - ".github/workflows/fetch-osm-community-centres.yml"
      - "tools/fetch_osm_community_centres.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Download OSM snapshots
        run: |
          python tools/fetch_osm_community_centres.py \
            --start "${{ inputs.start || '2015' }}" \
            --end "${{ inputs.end || '2025' }}"
          wc -l source/osm/*.jsonl
          ls -lh source/osm/
      - name: Keep a compressed copy on a throwaway branch
        run: |
          mkdir -p /tmp/keep && gzip -9 -k source/osm/*.jsonl && cp source/osm/*.jsonl.gz /tmp/keep/
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan workflow-data-osm
          git rm -rf --cached -q . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/keep/* .
          git add ./*.gz
          git commit -q -m "OSM community-centre snapshots (workflow output)"
          git push --force origin workflow-data-osm
      - uses: actions/upload-artifact@v4
        with:
          name: osm-community-centres
          path: source/osm/*.jsonl
          retention-days: 30
          if-no-files-found: error
