# One-off check of which open-data sources GitHub's servers can reach (status codes only, nothing is stored).
name: Probe data sources

on:
  workflow_dispatch:
  push:
    branches: [community-closures-data]
    paths:
      - ".github/workflows/probe-data-sources.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reachability
        run: |
          probe() { printf '%-3s ' "$(curl -s -o /dev/null -m 40 -L -w '%{http_code}' -A 'Mozilla/5.0' "$1")"; echo "$1"; }
          probe "https://register-of-charities.charitycommission.gov.uk/en/register/full-register-download"
          probe "https://prd-ds-register-of-charities.charitycommission.gov.uk/en/register/full-register-download"
          probe "https://www.oscr.org.uk/about-charities/search-the-register/charity-register-download"
          probe "https://www.nomisweb.co.uk/api/v01/dataset/def.sdmx.json"
          probe "https://www.nomisweb.co.uk/census/2021/bulk"
          probe "https://www.ons.gov.uk/census/2011census"
          probe "https://geoportal.statistics.gov.uk/"
          probe "https://github.com/humaniverse/IMD"
      - name: Nomis dataset ids for business counts and census tables
        run: |
          curl -s -m 60 -A 'Mozilla/5.0' "https://www.nomisweb.co.uk/api/v01/dataset/def.sdmx.json" -o nomis.json || true
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("nomis.json"))
              for k in d["structure"]["keyfamilies"]["keyfamily"]:
                  name = k["name"]["value"]
                  if any(w in name for w in ("Business Counts", "ethnic", "Ethnic", "religion", "Religion", "main language", "Country of birth")):
                      print(k["id"], "|", name)
          except Exception as e:
              print("could not read Nomis dataset list:", e)
          PY
