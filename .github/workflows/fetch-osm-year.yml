# One job per year, in parallel, in case a single sequential run is too slow.
# Each job pushes its snapshot to branch workflow-data-osm-<year>.
name: Fetch OSM community centres (per year)
on:
  workflow_dispatch:
  push:
    branches: [community-closures-data]
    paths: [".github/workflows/fetch-osm-year.yml"]
permissions:
  contents: write
jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        year: [2015, 2018, 2020, 2022, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && pip install shapely
      - run: python tools/fetch_osm_community_centres.py --years "${{ matrix.year }}" --out source/osm
      - name: Keep a compressed copy on a throwaway branch
        run: |
          mkdir -p /tmp/keep && gzip -9 -k source/osm/*.jsonl && cp source/osm/*.jsonl.gz /tmp/keep/
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan workflow-data-osm-${{ matrix.year }}
          git rm -rf --cached -q . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/keep/* .
          git add ./*.gz
          git commit -q -m "OSM community-centre snapshot ${{ matrix.year }}"
          git push --force origin workflow-data-osm-${{ matrix.year }}
