# One-off: lists the Nomis codes needed to fetch Business Counts. Prints only, stores nothing.
name: Explore Nomis

on:
  workflow_dispatch:
  push:
    branches: [community-closures-data]
    paths:
      - ".github/workflows/explore-nomis.yml"
      - "tools/explore_nomis.py"

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/explore_nomis.py
