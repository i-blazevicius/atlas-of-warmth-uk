name: Probe Geofabrik historic extracts
on:
  workflow_dispatch:
  push:
    branches: [community-closures-data]
    paths: [".github/workflows/probe-geofabrik.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ohsome geometry 403 body, small bbox
        run: |
          curl -s -m 120 -i -X POST "https://api.ohsome.org/v1/elements/geometry" \
            --data-urlencode "bboxes=-0.2,51.4,-0.0,51.6" \
            --data-urlencode "time=2015-01-01" \
            --data-urlencode "filter=amenity=community_centre and type:node" \
            --data-urlencode "properties=tags" | head -30
