name: Probe Geofabrik historic extracts
on:
  workflow_dispatch:
  push:
    branches: [community-closures-data]
    paths: [".github/workflows/probe-geofabrik.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Head requests for dated snapshots
        run: |
          for y in 15 20 25; do
            for r in europe/great-britain europe/ireland-and-northern-ireland; do
              u="https://download.geofabrik.de/${r}-${y}0101.osm.pbf"
              echo "$u $(curl -sIL -m 30 "$u" | grep -E "^HTTP|^location" | tr "\n" " " | tr -d '\r') $(curl -sIL -m 30 "$u" | grep -i "^content-length" | tail -1 | tr -d "\r")"
            done
          done
      - name: Overpass status
        run: curl -s -m 30 https://overpass-api.de/api/status | head -12
