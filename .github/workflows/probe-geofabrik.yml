name: Probe Geofabrik historic extracts
on:
  workflow_dispatch:
  push:
    branches: [community-closures-data]
    paths: [".github/workflows/probe-geofabrik.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download speed (20 s sample of the 2025 GB file)
        run: |
          curl -sL -m 20 -o /tmp/sample.pbf -w "bytes=%{size_download} speed=%{speed_download} B/s\n" https://download.geofabrik.de/europe/great-britain-250101.osm.pbf || true
      - name: Time a full small download (NI 2015, ~87 MB)
        run: |
          /usr/bin/time -v curl -sL -m 300 -o /tmp/ni15.pbf https://download.geofabrik.de/europe/ireland-and-northern-ireland-150101.osm.pbf 2>&1 | grep -E "Elapsed|Maximum" ; ls -l /tmp/ni15.pbf
      - name: Time osmium filter
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          time osmium tags-filter -o /tmp/f.pbf /tmp/ni15.pbf nwr/amenity=community_centre,social_centre
          time osmium export -f geojsonseq -o /tmp/f.gj /tmp/f.pbf; wc -l /tmp/f.gj
