name: Probe Geofabrik historic extracts
on:
  workflow_dispatch:
  push:
    branches: [community-closures-data]
    paths: [".github/workflows/probe-geofabrik.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Headers and a short GET
        run: |
          u=https://download.geofabrik.de/europe/ireland-and-northern-ireland-150101.osm.pbf
          curl -sIL -m 30 "$u"
          echo ---- GET
          curl -sL -m 30 -o /tmp/x.pbf -D - -w "bytes=%{size_download} code=%{http_code} url=%{url_effective} time=%{time_total}\n" "$u" | head -40
          ls -l /tmp/x.pbf; head -c 300 /tmp/x.pbf | strings | head -5
