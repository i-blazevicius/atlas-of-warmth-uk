name: Probe Geofabrik historic extracts
on:
  workflow_dispatch:
  push:
    branches: [community-closures-data]
    paths: [".github/workflows/probe-geofabrik.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ohsome snapshot centroids, UK bbox, 2015-01-01
        run: |
          F='(amenity in (community_centre, social_centre)) or (disused:amenity in (community_centre, social_centre)) or (was:amenity in (community_centre, social_centre)) or (abandoned:amenity in (community_centre, social_centre))'
          for ep in elements/count elements/geometry; do
            echo "== $ep"
            extra="properties=tags"; [ "$ep" = elements/count ] && extra="showMetadata=false"
            curl -s -m 600 -o /tmp/out.json -w "code=%{http_code} bytes=%{size_download} time=%{time_total}\n" \
              -X POST "https://api.ohsome.org/v1/$ep" \
              --data-urlencode "bboxes=-8.7,49.8,2.0,60.9" \
              --data-urlencode "time=2015-01-01" \
              --data-urlencode "filter=$F" \
              --data-urlencode "$extra"
            head -c 500 /tmp/out.json; echo; ls -l /tmp/out.json
          done
