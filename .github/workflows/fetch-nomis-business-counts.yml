# Downloads UK Business Counts (Nomis) for pubs, religious organisations, other membership
# organisations, libraries and sports clubs, per MSOA and Scottish intermediate zone, 2010-2026.
name: Fetch Nomis business counts

on:
  workflow_dispatch:
  push:
    branches: [community-closures-data]
    paths:
      - ".github/workflows/fetch-nomis-business-counts.yml"
      - "tools/fetch_nomis_business_counts.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/fetch_nomis_business_counts.py --years 2010-2026
      - run: wc -l source/nomis/*.csv && head -5 source/nomis/*.csv
      - name: Keep a compressed copy on a throwaway branch
        run: |
          mkdir -p /tmp/keep && gzip -9 -k source/nomis/*.csv && cp source/nomis/*.csv.gz /tmp/keep/
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan workflow-data-nomis
          git rm -rf --cached -q . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/keep/* .
          git add ./*.gz
          git commit -q -m "Nomis business counts (workflow output)"
          git push --force origin workflow-data-nomis
      - uses: actions/upload-artifact@v4
        with:
          name: nomis-business-counts
          path: source/nomis/*.csv
          retention-days: 30
          if-no-files-found: error
