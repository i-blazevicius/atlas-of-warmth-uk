name: Probe Scottish zone sources
on:
  workflow_dispatch:
  push:
    branches: [community-closures-data]
    paths: [".github/workflows/probe-scotland.yml", "tools/probe_scotland.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe_scotland.py
